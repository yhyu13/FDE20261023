[project]
name = "fde-training"
version = "0.1.0"
description = "GPS 2026 FDE 智能人才工厂 · 六道真题的可验证 AI 原型"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tools"]
# .kilo/skills/ 里是整份拷进来的第三方 skill（hyperframes 的 lint_source.py 等）。
# 保持与上游逐字一致，好让下次重新 vendor 时能干净覆盖、不留本地分叉；
# 逐条修它的 lint 会在下次 vendor 时被整体冲掉，等于白干。
# assets/ 是素材与交付物，不是源码目录，里面的一次性探针脚本不入库也不按本仓规则改。
extend-exclude = [".kilo/skills", "assets"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]
# tools/video/vendor/ 是从 karpathy-explain-better skill 整份拷进来的第三方脚本。
# 保持与上游逐字一致，好让下次重新 vendor 时能干净覆盖、不留本地分叉；
# 在这里逐条修它的 lint，改动会在下次 vendor 时被整体冲掉，等于白干。
"tools/video/vendor/*" = ["ALL"]
